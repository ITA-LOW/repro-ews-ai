[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ews-ai"
version = "0.1.0"
description = "Anonymous reproduction package for the EWS-AI ICAART manuscript."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "pyyaml>=6.0",
    "scikit-learn>=1.3",
    "tensorflow>=2.13",
]

[project.optional-dependencies]
train = [
    "tensorflow>=2.13",
]

[tool.setuptools.packages.find]
where = ["src"]
