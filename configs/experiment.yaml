# Frozen experiment protocol. Changing these values changes every table.
# Reviewers should not edit this file unless reproducing a stated sensitivity study.

seed: 42
n_stations: 100
min_hours_per_station: 50
years: [2023, 2024]

# Station pick is sorted by WMO code (A801, A802, ...), never by filesystem glob order.
station_selection: sorted_station_id

# Temporal split used by experiments 02–03 (implemented there; recorded here for freeze).
split:
  strategy: temporal_per_station
  test_fraction: 0.2

# Table 2. Poisson enters only as sample_weight = 1 + scale * p_risk.
classification:
  poisson_weight_scale: 9.0
  val_fraction: 0.1
  epochs: 12
  batch_size: 256
  dropout: 0.2
  # 0 = no early stop. A dry temporal val slice would otherwise collapse recall.
  patience: 0
  verbose: 2
  mlp_hidden: [32]
  mlp_max_iter: 15
  mlp_batch_size: 256
  softmax_max_iter: 30
  cart_max_depth: 10
  cart_min_samples_leaf: 50

features:
  - temperature_c
  - humidity_pct
  - precip_6h
  - precip_24h
  - soil_moisture

window_size: 6

# Physical hazard labels. Poisson P_risk is NEVER written into y.
labels:
  landslide:
    precip_24h_mm: 50.0
    soil_moisture_pct: 60.0
  flood:
    precip_6h_mm: 30.0
    precip_1h_mm: 20.0
  # 0 = no risk, 1 = landslide, 2 = flood, 3 = multi-hazard
  encoding: {none: 0, landslide: 1, flood: 2, multi: 3}

soil:
  initial_pct: 40.0
  wet_gain: 1.6
  evap_base: 0.45
  evap_temp_coef: 0.03
  evap_temp_ref_c: 20.0
  clip_min: 12.0
  clip_max: 98.0

# 1.0 W panel at STC (1000 W/m^2). INMET radiation is kJ/m^2 per hour.
solar:
  kj_to_wm2: 3.6
  panel_peak_mw: 1000.0

battery:
  initial_soc_pct: 70.0
  capacity_mwh: 1500.0
  idle_mw: 45.0
  rain_mw: 55.0
  soc_clip_min: 5.0
  soc_clip_max: 100.0
  low_soc_pct: 20.0

poisson:
  lambda_0: 0.005
  alpha: 1.2
  beta: 1.5
  gamma: 1.8
  p_crit_6h_mm: 35.0
  p_crit_24h_mm: 60.0
  sm_sat_pct: 65.0
  exponent_clip: 10.0
  horizon_hours: 6
  # Must stay false for the main tables. A date bonus on λ is not a prediction test.
  use_event_prior: false
  event_bonus: 0.8

# Belief threshold used by the BDI policy replay (energy), not by classification y.
bdi:
  hazard_p_risk: 0.20
  action_encoding: {deep_sleep: 0, espnow_relay: 1, lora_alert: 2}

# Datasheet-mean power for simulated energy (experiment 04). Stated as simulation.
energy:
  p_deep_sleep_mw: 1.85
  p_espnow_mw: 18.0
  p_lora_mw: 30.0
  p_continuous_tx_mw: 120.0
  p_fixed_timer_mw: 45.0
  p_fixed_lora_mw: 30.0
  assume_neighbor: true
  lifepo4_capacity_mwh: 9620.0
  # Experiment 09: same CART, same hourly wake. Not an M1–M4 ablation.
  capacity_sweep_mwh: [9620.0, 1500.0, 500.0, 200.0]
  solar_degradation_per_year: 0.005
  battery_degradation_per_year: 0.02
  simulation_years: 10
  # Sub-hour duty cycle (experiment 07). Weather remains hourly.
  p_awake_mw: 80.0
  t_awake_s: 2.0
  t_lora_tx_s: 1.0
  t_espnow_tx_s: 0.05
  p_lora_tx_mw: 400.0
  p_espnow_tx_mw: 180.0
  t_sleep_hazard_s: 120
  t_sleep_rain_s: 300
  t_sleep_calm_s: 3600
  rain_wake_mm: 5.0

# Held-out convenience sample of publicly reported episodes.
# Never written into λ(t) or risk_label. Scored only by experiments/05_event_audit.py.
event_audit:
  p_risk_threshold: 0.20
  pre_window_hours: 24
  events:
    - id: rs_floods_2024
      uf: RS
